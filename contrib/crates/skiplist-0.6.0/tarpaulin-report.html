ments and provides efficient way to\n/// access, insert and remove nodes.\n///\n/// Unlike a standard linked list, the skiplist can skip ahead when trying to\n/// find a particular index.\npub struct SkipList\u003cT, Gen = Geometric\u003e {\n    // Storage, this is not sorted\n    head: Box\u003cSkipNode\u003cT\u003e\u003e,\n    len: usize,\n    level_generator: Gen,\n}\n\n// ///////////////////////////////////////////////\n// Inherent methods\n// ///////////////////////////////////////////////\n\nimpl\u003cT\u003e SkipList\u003cT\u003e {\n    /// Create a new skiplist with the default number of 16 levels.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist: SkipList\u003ci64\u003e = SkipList::new();\n    /// ```\n    #[inline]\n    pub fn new() -\u003e Self {\n        // Parameters are fixed and will produce a valid level generator.\n        let lg = Geometric::new(16, 1.0 / 2.0).expect(\"Failed to create level generator.\");\n        Self::new_from_gen(lg)\n    }\n\n    /// Constructs a new, empty skiplist with the optimal number of levels for\n    /// the intended capacity.  Specifically, it uses `floor(log2(capacity))`\n    /// number of levels, ensuring that only *a few* nodes occupy the highest\n    /// level.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::with_capacity(100);\n    /// skiplist.extend(0..100);\n    /// ```\n    #[inline]\n    pub fn with_capacity(capacity: usize) -\u003e Self {\n        let levels = cmp::max(1, (capacity as f64).log2().floor() as usize);\n        // Parameters are safe as levels \u003e= 1 and p is in (0, 1).\n        let lg = Geometric::new(levels, 1.0 / 2.0).expect(\"Failed to create level generator.\");\n        Self::new_from_gen(lg)\n    }\n}\n\nimpl\u003cT, G\u003e SkipList\u003cT, G\u003e\nwhere\n    G: LevelGenerator,\n{\n    /// Constructs a new, empty skip list using a given [LevelGenerator]\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::{SkipList, level_generator::GeometricalLevelGenerator};\n    ///\n    /// let lg = GeometricalLevelGenerator::new(10, 0.5);\n    /// let mut skiplist: SkipList\u003ci64\u003e = SkipList::new_from_gen(lg);\n    /// ```\n    #[inline]\n    pub fn new_from_gen(lg: G) -\u003e Self {\n        SkipList {\n            head: Box::new(SkipNode::head(lg.total())),\n            len: 0,\n            level_generator: lg,\n        }\n    }\n\n    /// Clears the skiplist, removing all values.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// skiplist.clear();\n    /// assert!(skiplist.is_empty());\n    /// ```\n    #[inline]\n    pub fn clear(\u0026mut self) {\n        self.len = 0;\n        *self.head = SkipNode::head(self.level_generator.total());\n    }\n\n    /// Returns the number of elements in the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// assert_eq!(skiplist.len(), 10);\n    /// ```\n    #[inline]\n    pub fn len(\u0026self) -\u003e usize {\n        self.len\n    }\n\n    /// Returns `true` if the skiplist contains no elements.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// assert!(skiplist.is_empty());\n    ///\n    /// skiplist.push_back(1);\n    /// assert!(!skiplist.is_empty());\n    /// ```\n    #[inline]\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.len == 0\n    }\n\n    /// Insert the element into the skiplist at the given index, shifting all\n    /// subsequent nodes down.\n    ///\n    /// # Panics\n    ///\n    /// Panics if the insert index is greater than the length of the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    ///\n    /// skiplist.insert(0, 0);\n    /// skiplist.insert(5, 1);\n    /// assert_eq!(skiplist.len(), 2);\n    /// assert!(!skiplist.is_empty());\n    /// ```\n    pub fn insert(\u0026mut self, value: T, index: usize) {\n        if index \u003e self.len() {\n            panic!(\"Index out of bounds.\");\n        }\n        self.len += 1;\n        let new_node = Box::new(SkipNode::new(value, self.level_generator.level()));\n        self.head\n            .insert_at(new_node, index)\n            .unwrap_or_else(|_| panic!(\"No insertion position is found!\"));\n    }\n\n    /// Insert the element into the front of the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.push_front(1);\n    /// skiplist.push_front(2);\n    /// ```\n    pub fn push_front(\u0026mut self, value: T) {\n        self.insert(value, 0);\n    }\n\n    /// Insert the element into the back of the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.push_back(1);\n    /// skiplist.push_back(2);\n    /// ```\n    pub fn push_back(\u0026mut self, value: T) {\n        let len = self.len();\n        self.insert(value, len);\n    }\n\n    /// Provides a reference to the front element, or `None` if the skiplist is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// assert!(skiplist.front().is_none());\n    ///\n    /// skiplist.push_back(1);\n    /// skiplist.push_back(2);\n    /// assert_eq!(skiplist.front(), Some(\u00261));\n    /// ```\n    #[inline]\n    pub fn front(\u0026self) -\u003e Option\u003c\u0026T\u003e {\n        if self.is_empty() { None } else { self.get(0) }\n    }\n\n    /// Provides a mutable reference to the front element, or `None` if the\n    /// skiplist is empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// assert!(skiplist.front().is_none());\n    ///\n    /// skiplist.push_back(1);\n    /// skiplist.push_back(2);\n    /// assert_eq!(skiplist.front_mut(), Some(\u0026mut 1));\n    /// ```\n    #[inline]\n    pub fn front_mut(\u0026mut self) -\u003e Option\u003c\u0026mut T\u003e {\n        if self.is_empty() {\n            None\n        } else {\n            self.get_mut(0)\n        }\n    }\n\n    /// Provides a reference to the back element, or `None` if the skiplist is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// assert!(skiplist.back().is_none());\n    ///\n    /// skiplist.push_back(1);\n    /// skiplist.push_back(2);\n    /// assert_eq!(skiplist.back(), Some(\u00262));\n    /// ```\n    #[inline]\n    pub fn back(\u0026self) -\u003e Option\u003c\u0026T\u003e {\n        let len = self.len();\n        if len \u003e 0 { self.get(len - 1) } else { None }\n    }\n\n    /// Provides a reference to the back element, or `None` if the skiplist is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// assert!(skiplist.back().is_none());\n    ///\n    /// skiplist.push_back(1);\n    /// skiplist.push_back(2);\n    /// assert_eq!(skiplist.back_mut(), Some(\u0026mut 2));\n    /// ```\n    #[inline]\n    pub fn back_mut(\u0026mut self) -\u003e Option\u003c\u0026mut T\u003e {\n        let len = self.len();\n        if len \u003e 0 { self.get_mut(len - 1) } else { None }\n    }\n\n    /// Provides a reference to the element at the given index, or `None` if the\n    /// skiplist is empty or the index is out of bounds.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// assert!(skiplist.get(0).is_none());\n    /// skiplist.extend(0..10);\n    /// assert_eq!(skiplist.get(0), Some(\u00260));\n    /// assert!(skiplist.get(10).is_none());\n    /// ```\n    #[inline]\n    pub fn get(\u0026self, index: usize) -\u003e Option\u003c\u0026T\u003e {\n        self.get_index(index).and_then(|node| node.item.as_ref())\n    }\n\n    /// Provides a mutable reference to the element at the given index, or\n    /// `None` if the skiplist is empty or the index is out of bounds.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// assert!(skiplist.get_mut(0).is_none());\n    /// skiplist.extend(0..10);\n    /// assert_eq!(skiplist.get_mut(0), Some(\u0026mut 0));\n    /// assert!(skiplist.get_mut(10).is_none());\n    /// ```\n    #[inline]\n    pub fn get_mut(\u0026mut self, index: usize) -\u003e Option\u003c\u0026mut T\u003e {\n        self.get_index_mut(index)\n            .and_then(|node| node.item.as_mut())\n    }\n\n    /// Removes the first element and returns it, or `None` if the sequence is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.push_back(1);\n    /// skiplist.push_back(2);\n    ///\n    /// assert_eq!(skiplist.pop_front(), Some(1));\n    /// assert_eq!(skiplist.pop_front(), Some(2));\n    /// assert!(skiplist.pop_front().is_none());\n    /// ```\n    #[inline]\n    pub fn pop_front(\u0026mut self) -\u003e Option\u003cT\u003e {\n        if self.is_empty() {\n            None\n        } else {\n            Some(self.remove(0))\n        }\n    }\n\n    /// Removes the last element and returns it, or `None` if the sequence is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.push_back(1);\n    /// skiplist.push_back(2);\n    ///\n    /// assert_eq!(skiplist.pop_back(), Some(2));\n    /// assert_eq!(skiplist.pop_back(), Some(1));\n    /// assert!(skiplist.pop_back().is_none());\n    /// ```\n    #[inline]\n    pub fn pop_back(\u0026mut self) -\u003e Option\u003cT\u003e {\n        let len = self.len();\n        if len \u003e 0 {\n            Some(self.remove(len - 1))\n        } else {\n            None\n        }\n    }\n\n    /// Removes and returns an element with the given index.\n    ///\n    /// # Panics\n    ///\n    /// Panics is the index is out of bounds.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// assert_eq!(skiplist.remove(4), 4);\n    /// assert_eq!(skiplist.remove(4), 5);\n    /// ```\n    pub fn remove(\u0026mut self, index: usize) -\u003e T {\n        if index \u003e= self.len() {\n            panic!(\"Index out of bounds.\");\n        } else {\n            let node = self.head.remove_at(index).unwrap();\n            self.len -= 1;\n            node.into_inner().unwrap()\n        }\n    }\n\n    /// Retains only the elements specified by the predicate.\n    ///\n    /// In other words, remove all elements `e` such that `f(\u0026e)` returns false.\n    /// This method operates in place.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// skiplist.retain(|\u0026x| x%2 == 0);\n    /// ```\n    pub fn retain\u003cF\u003e(\u0026mut self, mut f: F)\n    where\n        F: FnMut(\u0026T) -\u003e bool,\n    {\n        self.len -= self.head.retain(move |_, x| f(x));\n    }\n\n    /// Get an owning iterator over the entries of the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// for i in skiplist.into_iter() {\n    ///     println!(\"Value: {}\", i);\n    /// }\n    /// ```\n    #[allow(clippy::should_implement_trait)]\n    pub fn into_iter(mut self) -\u003e IntoIter\u003cT\u003e {\n        let len = self.len();\n        unsafe { IntoIter::from_head(\u0026mut self.head, len) }\n    }\n\n    /// Creates an iterator over the entries of the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// for i in skiplist.iter() {\n    ///     println!(\"Value: {}\", i);\n    /// }\n    /// ```\n    pub fn iter(\u0026self) -\u003e Iter\u003cT\u003e {\n        unsafe { Iter::from_head(\u0026self.head, self.len()) }\n    }\n\n    /// Creates an mutable iterator over the entries of the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// for i in skiplist.iter_mut() {\n    ///     println!(\"Value: {}\", i);\n    /// }\n    /// ```\n    pub fn iter_mut(\u0026mut self) -\u003e IterMut\u003cT\u003e {\n        let len = self.len();\n        unsafe { IterMut::from_head(\u0026mut self.head, len) }\n    }\n\n    /// Constructs a double-ended iterator over a sub-range of elements in the\n    /// skiplist, starting at min, and ending at max. If min is `Unbounded`,\n    /// then it will be treated as \"negative infinity\", and if max is\n    /// `Unbounded`, then it will be treated as \"positive infinity\".  Thus\n    /// range(Unbounded, Unbounded) will yield the whole collection.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    /// use std::ops::Bound::{Included, Unbounded};\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// for i in skiplist.range(Included(3), Included(7)) {\n    ///     println!(\"Value: {}\", i);\n    /// }\n    /// assert_eq!(Some(\u00264), skiplist.range(Included(4), Unbounded).next());\n    /// ```\n    pub fn range(\u0026self, min: Bound\u003cusize\u003e, max: Bound\u003cusize\u003e) -\u003e Iter\u003cT\u003e {\n        let first = Self::_lower_bound(min);\n        let last = self._upper_bound(max);\n        self.iter_range(first, last)\n    }\n\n    /// Constructs a mutable double-ended iterator over a sub-range of elements\n    /// in the skiplist, starting at min, and ending at max. If min is\n    /// `Unbounded`, then it will be treated as \"negative infinity\", and if max\n    /// is `Unbounded`, then it will be treated as \"positive infinity\".  Thus\n    /// range(Unbounded, Unbounded) will yield the whole collection.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    /// use std::ops::Bound::{Included, Unbounded};\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// for i in skiplist.range_mut(Included(3), Included(7)) {\n    ///     println!(\"Value: {}\", i);\n    /// }\n    /// assert_eq!(Some(\u0026mut 4), skiplist.range_mut(Included(4), Unbounded).next());\n    /// ```\n    pub fn range_mut(\u0026mut self, min: Bound\u003cusize\u003e, max: Bound\u003cusize\u003e) -\u003e IterMut\u003cT\u003e {\n        let first = match min {\n            Bound::Included(i) =\u003e i,\n            Bound::Excluded(i) =\u003e i + 1,\n            Bound::Unbounded =\u003e 0,\n        };\n        let last = match max {\n            Bound::Included(i) =\u003e i,\n            Bound::Excluded(i) =\u003e i - 1,\n            Bound::Unbounded =\u003e self.len() - 1,\n        };\n        self.iter_range_mut(first, last)\n    }\n\n    /// Returns an `Option\u003c\u0026T\u003e` pointing to the lowest element whose key is above\n    /// the given bound. If no such element is found then `None` is\n    /// returned.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    /// use std::ops::Bound::{Included, Excluded, Unbounded};\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    ///\n    /// assert_eq!(skiplist.lower_bound(Unbounded), Some(\u00260));\n    /// assert_eq!(skiplist.lower_bound(Excluded(0)), Some(\u00261));\n    /// assert_eq!(skiplist.lower_bound(Included(0)), Some(\u00260));\n    /// assert_eq!(skiplist.lower_bound(Excluded(10)), None);\n    /// ```\n    pub fn lower_bound(\u0026self, min: Bound\u003cusize\u003e) -\u003e Option\u003c\u0026T\u003e {\n        self.get_index(Self::_lower_bound(min))\n            .and_then(|node| node.item.as_ref())\n    }\n\n    /// Returns an `Option\u003c\u0026T\u003e` pointing to the highest element whose key is above\n    /// the given bound. If no such element is found then `None` is\n    /// returned.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    /// use std::ops::Bound::{Included, Excluded, Unbounded};\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    ///\n    /// assert_eq!(skiplist.upper_bound(Unbounded), Some(\u00269));\n    /// assert_eq!(skiplist.upper_bound(Excluded(9)), Some(\u00268));\n    /// assert_eq!(skiplist.upper_bound(Included(9)), Some(\u00269));\n    /// ```\n    pub fn upper_bound(\u0026self, max: Bound\u003cusize\u003e) -\u003e Option\u003c\u0026T\u003e {\n        self.get_index(self._upper_bound(max))\n            .and_then(|node| node.item.as_ref())\n    }\n\n    fn _lower_bound(min: Bound\u003cusize\u003e) -\u003e usize {\n        match min {\n            Bound::Included(i) =\u003e i,\n            Bound::Excluded(i) =\u003e i + 1,\n            Bound::Unbounded =\u003e 0,\n        }\n    }\n\n    fn _upper_bound(\u0026self, max: Bound\u003cusize\u003e) -\u003e usize {\n        match max {\n            Bound::Included(i) =\u003e i,\n            Bound::Excluded(i) =\u003e i - 1,\n            Bound::Unbounded =\u003e self.len() - 1,\n        }\n    }\n}\n\nimpl\u003cT, G\u003e SkipList\u003cT, G\u003e\nwhere\n    T: PartialEq,\n    G: LevelGenerator,\n{\n    /// Returns true if the value is contained in the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// assert!(skiplist.contains(\u00264));\n    /// assert!(!skiplist.contains(\u002615));\n    /// ```\n    pub fn contains(\u0026self, value: \u0026T) -\u003e bool {\n        self.iter().any(|val| val.eq(value))\n    }\n\n    /// Returns the index of the value if it's contained in the skiplist or None otherwise.\n    ///\n    /// Since this skip list is not ordered, this method has a complexity of O(n)\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.extend(0..10);\n    /// assert_eq!(skiplist.index_of(\u00264), 4);\n    /// ```\n    #[inline]\n    pub fn index_of(\u0026self, item: \u0026T) -\u003e Option\u003cusize\u003e {\n        self.iter()\n            .enumerate()\n            .find_map(|(idx, it)| if item.eq(it) { Some(idx) } else { None })\n    }\n\n    /// Removes all consecutive repeated elements in the skiplist.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipList;\n    ///\n    /// let mut skiplist = SkipList::new();\n    /// skiplist.push_back(0);\n    /// skiplist.push_back(0);\n    /// assert_eq!(skiplist.len(), 2);\n    /// skiplist.dedup();\n    /// assert_eq!(skiplist.len(), 1);\n    /// ```\n    pub fn dedup(\u0026mut self) {\n        let removed = self\n            .head\n            .retain(|prev, current| prev.is_none_or(|prev| !prev.eq(current)));\n        self.len -= removed;\n    }\n}\n\n// ///////////////////////////////////////////////\n// Internal methods\n// ///////////////////////////////////////////////\n\nimpl\u003cT, G\u003e SkipList\u003cT, G\u003e\nwhere\n    G: LevelGenerator,\n{\n    /// Checks the integrity of the skiplist.\n    #[allow(dead_code)]\n    fn check(\u0026self) {\n        self.head.check();\n    }\n\n    /// Makes an iterator between [begin, end]\n    fn iter_range(\u0026self, first_idx: usize, last_idx: usize) -\u003e Iter\u003cT\u003e {\n        if first_idx \u003e last_idx {\n            return Iter {\n                first: None,\n                last: None,\n                size: 0,\n            };\n        }\n        let first = self.get_index(first_idx);\n        let last = self.get_index(last_idx);\n        if first.is_some() \u0026\u0026 last.is_some() {\n            Iter {\n                first,\n                last,\n                size: last_idx - first_idx + 1,\n            }\n        } else {\n            Iter {\n                first: None,\n                last: None,\n                size: 0,\n            }\n        }\n    }\n\n    /// Makes an iterator between [begin, end]\n    fn iter_range_mut(\u0026mut self, first_idx: usize, last_idx: usize) -\u003e IterMut\u003cT\u003e {\n        if first_idx \u003e last_idx {\n            return IterMut {\n                first: None,\n                last: None,\n                size: 0,\n            };\n        }\n        let last = self.get_index_mut(last_idx).and_then(|p| NonNull::new(p));\n        let first = self.get_index_mut(first_idx);\n        if first.is_some() \u0026\u0026 last.is_some() {\n            IterMut {\n                first,\n                last,\n                size: last_idx - first_idx + 1,\n            }\n        } else {\n            IterMut {\n                first: None,\n                last: None,\n                size: 0,\n            }\n        }\n    }\n\n    /// Gets a pointer to the node with the given index.\n    fn get_index(\u0026self, index: usize) -\u003e Option\u003c\u0026SkipNode\u003cT\u003e\u003e {\n        if self.len() \u003c= index {\n            None\n        } else {\n            self.head.advance(index + 1)\n        }\n    }\n\n    fn get_index_mut(\u0026mut self, index: usize) -\u003e Option\u003c\u0026mut SkipNode\u003cT\u003e\u003e {\n        if self.len() \u003c= index {\n            None\n        } else {\n            self.head.advance_mut(index + 1)\n        }\n    }\n}\n\nimpl\u003cT\u003e SkipList\u003cT\u003e\nwhere\n    T: fmt::Debug,\n{\n    /// Prints out the internal structure of the skiplist (for debugging\n    /// purposes).\n    #[allow(dead_code)]\n    fn debug_structure(\u0026self) {\n        unsafe {\n            let mut node = self.head.as_ref();\n            let mut rows: Vec\u003c_\u003e = iter::repeat(String::new())\n                .take(self.level_generator.total())\n                .collect();\n\n            loop {\n                let value = match node.item {\n                    Some(ref v) =\u003e {\n                        format!(\"\u003e [{:?}]\", v)\n                    }\n                    _ =\u003e \"\u003e []\".to_string(),\n                };\n\n                let max_str_len = format!(\"{} -{}-\", value, node.links_len[node.level]).len() + 1;\n\n                let mut lvl = self.level_generator.total();\n                while lvl \u003e 0 {\n                    lvl -= 1;\n\n                    let mut value_len = if lvl \u003c= node.level {\n                        format!(\"{} -{}-\", value, node.links_len[lvl])\n                    } else {\n                        format!(\"{} -\", value)\n                    };\n                    for _ in 0..(max_str_len - value_len.len()) {\n                        value_len.push('-');\n                    }\n\n                    let mut dashes = String::new();\n                    for _ in 0..value_len.len() {\n                        dashes.push('-');\n                    }\n\n                    if lvl \u003c= node.level {\n                        rows[lvl].push_str(value_len.as_ref());\n                    } else {\n                        rows[lvl].push_str(dashes.as_ref());\n                    }\n                }\n\n                if let Some(next) = node.links[0].and_then(|p| p.as_ptr().as_ref()) {\n                    node = next;\n                } else {\n                    break;\n                }\n            }\n\n            for row in rows.iter().rev() {\n                println!(\"{}\", row);\n            }\n        }\n    }\n}\n\n// ///////////////////////////////////////////////\n// Trait implementation\n// ///////////////////////////////////////////////\n\nunsafe impl\u003cT: Send\u003e Send for SkipList\u003cT\u003e {}\nunsafe impl\u003cT: Sync\u003e Sync for SkipList\u003cT\u003e {}\n\nimpl\u003cT\u003e default::Default for SkipList\u003cT\u003e {\n    fn default() -\u003e SkipList\u003cT\u003e {\n        SkipList::new()\n    }\n}\n\n/// This implementation of PartialEq only checks that the *values* are equal; it\n/// does not check for equivalence of other features (such as the ordering\n/// function and the node levels). Furthermore, this uses `T`'s implementation\n/// of PartialEq and *does not* use the owning skiplist's comparison function.\nimpl\u003cA, B\u003e cmp::PartialEq\u003cSkipList\u003cB\u003e\u003e for SkipList\u003cA\u003e\nwhere\n    A: cmp::PartialEq\u003cB\u003e,\n{\n    #[inline]\n    fn eq(\u0026self, other: \u0026SkipList\u003cB\u003e) -\u003e bool {\n        self.len() == other.len() \u0026\u0026 self.iter().eq(other)\n    }\n    #[allow(clippy::partialeq_ne_impl)]\n    #[inline]\n    fn ne(\u0026self, other: \u0026SkipList\u003cB\u003e) -\u003e bool {\n        self.len != other.len || self.iter().ne(other)\n    }\n}\n\nimpl\u003cT\u003e cmp::Eq for SkipList\u003cT\u003e where T: cmp::Eq {}\n\nimpl\u003cA, B\u003e cmp::PartialOrd\u003cSkipList\u003cB\u003e\u003e for SkipList\u003cA\u003e\nwhere\n    A: cmp::PartialOrd\u003cB\u003e,\n{\n    #[inline]\n    fn partial_cmp(\u0026self, other: \u0026SkipList\u003cB\u003e) -\u003e Option\u003cOrdering\u003e {\n        self.iter().partial_cmp(other)\n    }\n}\n\nimpl\u003cT\u003e Ord for SkipList\u003cT\u003e\nwhere\n    T: cmp::Ord,\n{\n    #[inline]\n    fn cmp(\u0026self, other: \u0026SkipList\u003cT\u003e) -\u003e Ordering {\n        self.iter().cmp(other)\n    }\n}\n\nimpl\u003cT\u003e Extend\u003cT\u003e for SkipList\u003cT\u003e {\n    #[inline]\n    fn extend\u003cI: iter::IntoIterator\u003cItem = T\u003e\u003e(\u0026mut self, iterable: I) {\n        let iterator = iterable.into_iter();\n        for element in iterator {\n            self.push_back(element);\n        }\n    }\n}\n\nimpl\u003cT\u003e ops::Index\u003cusize\u003e for SkipList\u003cT\u003e {\n    type Output = T;\n\n    fn index(\u0026self, index: usize) -\u003e \u0026T {\n        self.get(index).expect(\"Index out of range\")\n    }\n}\n\nimpl\u003cT\u003e ops::IndexMut\u003cusize\u003e for SkipList\u003cT\u003e {\n    fn index_mut(\u0026mut self, index: usize) -\u003e \u0026mut Self::Output {\n        self.get_mut(index).expect(\"Index out of range\")\n    }\n}\n\nimpl\u003cT\u003e fmt::Debug for SkipList\u003cT\u003e\nwhere\n    T: fmt::Debug,\n{\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(f, \"[\")?;\n\n        for (i, entry) in self.iter().enumerate() {\n            if i != 0 {\n                write!(f, \", \")?;\n            }\n            write!(f, \"{:?}\", entry)?;\n        }\n        write!(f, \"]\")\n    }\n}\n\nimpl\u003cT\u003e fmt::Display for SkipList\u003cT\u003e\nwhere\n    T: fmt::Display,\n{\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(f, \"[\")?;\n\n        for (i, entry) in self.iter().enumerate() {\n            if i != 0 {\n                write!(f, \", \")?;\n            }\n            write!(f, \"{}\", entry)?;\n        }\n        write!(f, \"]\")\n    }\n}\n\nimpl\u003cT\u003e iter::IntoIterator for SkipList\u003cT\u003e {\n    type Item = T;\n    type IntoIter = IntoIter\u003cT\u003e;\n\n    fn into_iter(self) -\u003e IntoIter\u003cT\u003e {\n        self.into_iter()\n    }\n}\nimpl\u003c'a, T\u003e iter::IntoIterator for \u0026'a SkipList\u003cT\u003e {\n    type Item = \u0026'a T;\n    type IntoIter = Iter\u003c'a, T\u003e;\n\n    fn into_iter(self) -\u003e Iter\u003c'a, T\u003e {\n        self.iter()\n    }\n}\nimpl\u003c'a, T\u003e iter::IntoIterator for \u0026'a mut SkipList\u003cT\u003e {\n    type Item = \u0026'a mut T;\n    type IntoIter = IterMut\u003c'a, T\u003e;\n\n    fn into_iter(self) -\u003e IterMut\u003c'a, T\u003e {\n        self.iter_mut()\n    }\n}\n\nimpl\u003cT\u003e iter::FromIterator\u003cT\u003e for SkipList\u003cT\u003e {\n    #[inline]\n    fn from_iter\u003cI\u003e(iter: I) -\u003e SkipList\u003cT\u003e\n    where\n        I: iter::IntoIterator\u003cItem = T\u003e,\n    {\n        let mut skiplist = SkipList::new();\n        skiplist.extend(iter);\n        skiplist\n    }\n}\n\nimpl\u003cT: Hash\u003e Hash for SkipList\u003cT\u003e {\n    #[inline]\n    fn hash\u003cH: hash::Hasher\u003e(\u0026self, state: \u0026mut H) {\n        for elt in self {\n            elt.hash(state);\n        }\n    }\n}\n\n// ////////////////////////////////////////////////////////////////////////////\n// Tests\n// ////////////////////////////////////////////////////////////////////////////\n\n#[cfg(test)]\nmod tests {\n    use std::ops::Bound::{self, Excluded, Included, Unbounded};\n\n    use super::SkipList;\n\n    #[test]\n    fn push_front() {\n        let mut sl = SkipList::new();\n        for i in (1..100).rev() {\n            sl.push_front(i);\n        }\n\n        assert!(sl.into_iter().eq(1..100));\n    }\n\n    #[test]\n    fn push_back() {\n        let mut sl = SkipList::new();\n        for i in 1..100 {\n            sl.push_back(i);\n        }\n        assert!(sl.into_iter().eq(1..100));\n    }\n\n    #[test]\n    fn insert_rand() {\n        use rand::{Rng, distributions::Uniform};\n        let mut rng = rand::thread_rng();\n        let mut sl: SkipList\u003cusize\u003e = SkipList::new();\n        let mut vec: Vec\u003cusize\u003e = Vec::new();\n        for i in 0..100 {\n            let idx = rng.sample(Uniform::new_inclusive(0, i));\n            sl.insert(i, idx);\n            vec.insert(idx, i);\n        }\n        assert_eq!(sl.into_iter().collect::\u003cVec\u003c_\u003e\u003e(), vec);\n    }\n\n    #[test]\n    fn insert_repeat() {\n        let mut sl = SkipList::new();\n        let repeat = 10;\n        for val in 0..10 {\n            for i in 0..repeat {\n                sl.insert(val * 10 + i, val * 10);\n                sl.check();\n            }\n        }\n    }\n\n    #[test]\n    fn remove_rand() {\n        use rand::{Rng, distributions::Uniform};\n        let mut rng = rand::thread_rng();\n        let mut v: Vec\u003ci32\u003e = (0..1000).collect();\n        let mut sl: SkipList\u003ci32\u003e = (0..1000).collect();\n        for i in (0..1000).rev() {\n            let idx = rng.sample(Uniform::new_inclusive(0, i));\n            assert_eq!(sl.remove(idx), v.remove(idx));\n        }\n    }\n\n    #[test]\n    fn append_test() {}\n\n    #[test]\n    fn basic_small() {\n        let mut sl: SkipList\u003ci64\u003e = SkipList::new();\n        sl.check();\n        sl.insert(1, 0);\n        sl.check();\n        assert_eq!(sl.remove(0), 1);\n        sl.check();\n        sl.insert(1, 0);\n        sl.check();\n        sl.insert(2, 1);\n        sl.check();\n        assert_eq!(sl.remove(0), 1);\n        sl.check();\n        assert_eq!(sl.remove(0), 2);\n        sl.check();\n    }\n\n    #[test]\n    fn basic_large() {\n        let size = 500;\n        let mut sl = SkipList::with_capacity(500);\n        assert!(sl.is_empty());\n\n        for i in 0..size {\n            sl.insert(i, i);\n            assert_eq!(sl.len(), i + 1);\n        }\n        sl.check();\n\n        for i in 0..size {\n            assert_eq!(sl.remove(0), i);\n            assert_eq!(sl.len(), size - i - 1);\n        }\n        sl.check();\n\n        for i in 0..size {\n            sl = (0..size).collect();\n            assert_eq!(sl.remove(i), i);\n        }\n    }\n\n    #[test]\n    fn clear() {\n        let mut sl: SkipList\u003ci64\u003e = (0..100).collect();\n        assert_eq!(sl.len(), 100);\n        sl.clear();\n        sl.check();\n        assert!(sl.is_empty());\n    }\n\n    #[test]\n    fn last() {\n        let mut sl = SkipList::new();\n        assert_eq!(sl.iter().next_back(), None);\n        for i in 0..100 {\n            sl.push_back(i);\n            assert_eq!(sl.iter().next_back(), Some(\u0026i));\n        }\n    }\n\n    #[test]\n    fn iter() {\n        let size = 10000;\n\n        let mut sl: SkipList\u003c_\u003e = (0..size).collect();\n\n        fn test\u003cT\u003e(size: usize, mut iter: T)\n        where\n            T: Iterator\u003cItem = usize\u003e,\n        {\n            for i in 0..size {\n                assert_eq!(iter.size_hint(), (size - i, Some(size - i)));\n                assert_eq!(iter.next().unwrap(), i);\n            }\n            assert_eq!(iter.size_hint(), (0, Some(0)));\n            assert!(iter.next().is_none());\n        }\n        test(size, sl.iter().copied());\n        #[allow(clippy::map_clone)]\n        test(size, sl.iter_mut().map(|\u0026mut i| i));\n        test(size, sl.into_iter());\n    }\n\n    #[test]\n    fn iter_rev() {\n        let size = 10000;\n\n        let mut sl: SkipList\u003c_\u003e = (0..size).collect();\n\n        fn test\u003cT\u003e(size: usize, mut iter: T)\n        where\n            T: Iterator\u003cItem = usize\u003e,\n        {\n            for i in 0..size {\n                assert_eq!(iter.size_hint(), (size - i, Some(size - i)));\n                assert_eq!(iter.next().unwrap(), size - i - 1);\n            }\n            assert_eq!(iter.size_hint(), (0, Some(0)));\n            assert!(iter.next().is_none());\n        }\n        test(size, sl.iter().rev().copied());\n        #[allow(clippy::map_clone)]\n        test(size, sl.iter_mut().rev().map(|\u0026mut i| i));\n        test(size, sl.into_iter().rev());\n    }\n\n    #[test]\n    fn iter_mixed() {\n        let size = 10000;\n\n        let mut sl: SkipList\u003c_\u003e = (0..size).collect();\n\n        fn test\u003cT\u003e(size: usize, mut iter: T)\n        where\n            T: Iterator\u003cItem = usize\u003e + DoubleEndedIterator,\n        {\n            for i in 0..size / 4 {\n                assert_eq!(iter.size_hint(), (size - i * 2, Some(size - i * 2)));\n                assert_eq!(iter.next().unwrap(), i);\n                assert_eq!(iter.next_back().unwrap(), size - i - 1);\n            }\n            for i in size / 4..size * 3 / 4 {\n                assert_eq!(iter.size_hint(), (size * 3 / 4 - i, Some(size * 3 / 4 - i)));\n                assert_eq!(iter.next().unwrap(), i);\n            }\n            assert_eq!(iter.size_hint(), (0, Some(0)));\n            assert!(iter.next().is_none());\n        }\n        test(size, sl.iter().copied());\n        #[allow(clippy::map_clone)]\n        test(size, sl.iter_mut().map(|\u0026mut i| i));\n        test(size, sl.into_iter());\n    }\n\n    #[test]\n    fn range_small() {\n        let size = 5;\n\n        let sl: SkipList\u003c_\u003e = (0..size).collect();\n\n        let mut j = 0;\n        for (\u0026v, i) in sl.range(Included(2), Unbounded).zip(2..size) {\n            assert_eq!(v, i);\n            j += 1;\n        }\n        assert_eq!(j, size - 2);\n    }\n\n    #[test]\n    fn range_1000() {\n        let size = 1000;\n        let sl: SkipList\u003c_\u003e = (0..size).collect();\n\n        fn test(sl: \u0026SkipList\u003cusize\u003e, min: Bound\u003cusize\u003e, max: Bound\u003cusize\u003e) {\n            let mut values = sl.range(min ded, Excluded(b)) =\u003e 0..b,\n                (Excluded(a), Included(b)) =\u003e (a + 1)..(b + 1),\n                (Included(a), Included(b)) =\u003e a..(b + 1),\n                (Unbounded, Included(b)) =\u003e 0..(b + 1),\n                (Excluded(a), Unbounded) =\u003e (a + 1)..1000,\n                (Included(a), Unbounded) =\u003e a..1000,\n                (Unbounded, Unbounded) =\u003e 0..1000,\n            };\n            assert_eq!(values.size_hint(), expects.size_hint());\n\n            for (\u0026v, e) in values.by_ref().zip(expects.by_ref()) {\n                assert_eq!(v, e);\n            }\n            assert!(values.next().is_none());\n            assert!(expects.next().is_none());\n        }\n\n        test(\u0026mut sl, Excluded(200), Excluded(800));\n        test(\u0026mut sl, Included(200), Excluded(800));\n        test(\u0026mut sl, Unbounded, Excluded(800));\n        test(\u0026mut sl, Excluded(200), Included(800));\n        test(\u0026mut sl, Included(200), Included(800));\n        test(\u0026mut sl, Unbounded, Included(800));\n        test(\u0026mut sl, Excluded(200), Unbounded);\n        test(\u0026mut sl, Included(200), Unbounded);\n        test(\u0026mut sl, Unbounded, Unbounded);\n    }\n\n    #[test]\n    fn range() {\n        let size = 200;\n        let sl: SkipList\u003c_\u003e = (0..size).collect();\n\n        for i in 0..size {\n            for j in 0..size {\n                let mut values = sl.range(Included(i), Included(j));\n                let mut expects = i..=j;\n\n                for (\u0026v, e) in values.by_ref().zip(expects.by_ref()) {\n                    assert_eq!(v, e);\n                }\n                assert!(values.next().is_none());\n                assert!(expects.next().is_none());\n            }\n        }\n\n        for i in 0..size {\n            for j in 0..size {\n                let mut values = sl.range(Included(i), Included(j)).rev();\n                let mut expects = (i..=j).rev();\n\n ne":954,"address":[],"length":0,"stats":{"Line":1044}},{"line":958,"address":[],"length":0,"stats":{"Line":1044}},{"line":959,"address":[],"length":0,"stats":{"Line":1044}},{"line":960,"address":[],"length":0,"stats":{"Line":1044}},{"line":966,"address":[],"length":0,"stats":{"Line":0}},{"line":967,"address":[],"length":0,"stats":{"Line":0}},{"line":968,"address":[],"length":0,"stats":{"Line":0}}],"covered":168,"coverable":215},{"path":["/","Users","joshua.ellis","src","JP-Ellis","rust-skiplist","src","skipmap.rs"],"content":"//! SkipMap stores key-value pairs, with the keys being unique and always\n//! sorted.\n\nuse std::{\n    borrow::Borrow, cmp, cmp::Ordering, default, fmt, hash, hash::Hash, iter, mem, ops, ops::Bound,\n};\n\npub use crate::skipnode::IntoIter;\nuse crate::{\n    level_generator::{LevelGenerator, geometric::Geometric},\n    skipnode::{self, SkipListAction, insertion_fixup},\n};\n\ntype SkipNode\u003cK, V\u003e = skipnode::SkipNode\u003c(K, V)\u003e;\n\nimpl\u003cK, V\u003e SkipNode\u003cK, V\u003e {\n    fn key_ref(\u0026self) -\u003e Option\u003c\u0026K\u003e {\n        self.item.as_ref().map(|item| \u0026item.0)\n    }\n\n    fn value_ref(\u0026self) -\u003e Option\u003c\u0026V\u003e {\n        self.item.as_ref().map(|item| \u0026item.1)\n    }\n\n    fn value_mut(\u0026mut self) -\u003e Option\u003c\u0026mut V\u003e {\n        self.item.as_mut().map(|item| \u0026mut item.1)\n    }\n\n    fn item_ref(\u0026self) -\u003e Option\u003c(\u0026K, \u0026V)\u003e {\n        self.item.as_ref().map(|item| (\u0026item.0, \u0026item.1))\n    }\n\n    fn item_mut(\u0026mut self) -\u003e Option\u003c(\u0026K, \u0026mut V)\u003e {\n        self.item.as_mut().map(|item| (\u0026item.0, \u0026mut item.1))\n    }\n}\n\n// ////////////////////////////////////////////////////////////////////////////\n// SkipMap\n// ////////////////////////////////////////////////////////////////////////////\n\n/// The skipmap provides a way of storing element pairs such that they keys are\n/// always sorted whilst at the same time providing efficient way to access,\n/// insert and removes nodes.\n///\n/// A particular node can be accessed through the matching key, and since the\n/// keys are always sorted, it is also possible to access key-value pairs by\n/// index.\n///\n/// Note that mutable references to keys are not available at all as this could\n/// result in a node being left out of the proper ordering.\npub struct SkipMap\u003cK, V\u003e {\n    // Storage, this is not sorted\n    head: Box\u003cSkipNode\u003cK, V\u003e\u003e,\n    len: usize,\n    level_generator: Geometric,\n}\n\n// ///////////////////////////////////////////////\n// Inherent methods\n// ///////////////////////////////////////////////\n\nimpl\u003cK, V\u003e SkipMap\u003cK, V\u003e\nwhere\n    K: cmp::Ord,\n{\n    /// Create a new skipmap with the default number of 16 levels.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap: SkipMap\u003ci64, String\u003e = SkipMap::new();\n    /// ```\n    #[inline]\n    pub fn new() -\u003e Self {\n        // Parameters are fixed and will produce a valid level generator.\n        let lg = Geometric::new(16, 1.0 / 2.0).expect(\"Failed to create level generator.\");\n        SkipMap {\n            head: Box::new(SkipNode::head(lg.total())),\n            len: 0,\n            level_generator: lg,\n        }\n    }\n\n    /// Constructs a new, empty skipmap with the optimal number of levels for\n    /// the intended capacity.  Specifically, it uses `floor(log2(capacity))`\n    /// number of levels, ensuring that only *a few* nodes occupy the highest\n    /// level.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::with_capacity(100);\n    /// skipmap.extend((0..100).map(|x| (x, x)));\n    /// ```\n    #[inline]\n    pub fn with_capacity(capacity: usize) -\u003e Self {\n        let levels = cmp::max(1, (capacity as f64).log2().floor() as usize);\n        // Parameters are safe as levels \u003e= 1 and p is in (0, 1).\n        let lg = Geometric::new(levels, 1.0 / 2.0).expect(\"Failed to create level generator.\");\n        SkipMap {\n            head: Box::new(SkipNode::head(lg.total())),\n            len: 0,\n            level_generator: lg,\n        }\n    }\n\n    /// Insert the element into the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    ///\n    /// skipmap.insert(1, \"Hello\");\n    /// skipmap.insert(2, \"World\");\n    /// assert_eq!(skipmap.len(), 2);\n    /// assert!(!skipmap.is_empty());\n    /// ```\n    pub fn insert(\u0026mut self, key: K, value: V) -\u003e Option\u003cV\u003e {\n        let level_gen = \u0026mut self.level_generator;\n        let inserter = InsertOrReplace::new(key, value, |k, v| {\n            Box::new(SkipNode::new((k, v), level_gen.level()))\n        });\n        let insert_res = inserter.act(self.head.as_mut());\n        match insert_res {\n            Ok(_) =\u003e {\n                self.len += 1;\n                None\n            }\n            Err(old_val) =\u003e Some(old_val),\n        }\n    }\n}\n\nimpl\u003cK, V\u003e SkipMap\u003cK, V\u003e {\n    /// Clears the skipmap, removing all values.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// skipmap.clear();\n    /// assert!(skipmap.is_empty());\n    /// ```\n    #[inline]\n    pub fn clear(\u0026mut self) {\n        self.len = 0;\n        *self.head = SkipNode::head(self.level_generator.total());\n    }\n\n    /// Returns the number of elements in the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// assert_eq!(skipmap.len(), 10);\n    /// ```\n    #[inline]\n    pub fn len(\u0026self) -\u003e usize {\n        self.len\n    }\n\n    /// Returns `true` if the skipmap contains no elements.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// assert!(skipmap.is_empty());\n    ///\n    /// skipmap.insert(1, \"Rust\");\n    /// assert!(!skipmap.is_empty());\n    /// ```\n    #[inline]\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.len == 0\n    }\n\n    /// Provides a reference to the front element, or `None` if the skipmap is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// assert!(skipmap.front().is_none());\n    ///\n    /// skipmap.insert(1, \"Hello\");\n    /// skipmap.insert(2, \"World\");\n    /// assert_eq!(skipmap.front(), Some((\u00261, \u0026\"Hello\")));\n    /// ```\n    #[inline]\n    pub fn front(\u0026self) -\u003e Option\u003c(\u0026K, \u0026V)\u003e {\n        self.get_index(0).and_then(|node| node.item_ref())\n    }\n\n    /// Provides a mutable reference to the front element, or `None` if the\n    /// skipmap is empty.\n    ///\n    /// The reference to the key remains immutable as the keys must remain\n    /// sorted.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// assert!(skipmap.front().is_none());\n    ///\n    /// skipmap.insert(1, \"Hello\");\n    /// skipmap.insert(2, \"World\");\n    /// assert_eq!(skipmap.front_mut(), Some((\u00261, \u0026mut \"Hello\")));\n    /// ```\n    #[inline]\n    pub fn front_mut(\u0026mut self) -\u003e Option\u003c(\u0026K, \u0026mut V)\u003e {\n        self.get_index_mut(0).and_then(|node| node.item_mut())\n    }\n\n    /// Provides a reference to the back element, or `None` if the skipmap is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// assert!(skipmap.back().is_none());\n    ///\n    /// skipmap.insert(1, \"Hello\");\n    /// skipmap.insert(2, \"World\");\n    /// assert_eq!(skipmap.back(), Some((\u00262, \u0026\"World\")));\n    /// ```\n    #[inline]\n    pub fn back(\u0026self) -\u003e Option\u003c(\u0026K, \u0026V)\u003e {\n        self.head.last().item_ref()\n    }\n\n    /// Provides a reference to the back element, or `None` if the skipmap is\n    /// empty.\n    ///\n    /// The reference to the key remains immutable as the keys must remain\n    /// sorted.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// assert!(skipmap.back().is_none());\n    ///\n    /// skipmap.insert(1, \"Hello\");\n    /// skipmap.insert(2, \"World\");\n    /// assert_eq!(skipmap.back_mut(), Some((\u00262, \u0026mut \"World\")));\n    /// ```\n    #[inline]\n    pub fn back_mut(\u0026mut self) -\u003e Option\u003c(\u0026K, \u0026mut V)\u003e {\n        self.head.last_mut().item_mut()\n    }\n\n    /// Provides a reference to the element at the given index, or `None` if the\n    /// skipmap is empty or the index is out of bounds.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// assert!(skipmap.get(\u00260).is_none());\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// assert_eq!(skipmap.get(\u00260), Some(\u00260));\n    /// assert!(skipmap.get(\u002610).is_none());\n    /// ```\n    #[inline]\n    pub fn get\u003cQ\u003e(\u0026self, key: \u0026Q) -\u003e Option\u003c\u0026V\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord + ?Sized,\n    {\n        self.find_key(key).and_then(|node| node.value_ref())\n    }\n\n    /// Provides a reference to the element at the given index, or `None` if the\n    /// skipmap is empty or the index is out of bounds.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// assert!(skipmap.get(\u00260).is_none());\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// assert_eq!(skipmap.get_mut(\u00260), Some(\u0026mut 0));\n    /// assert!(skipmap.get_mut(\u002610).is_none());\n    ///\n    /// match skipmap.get_mut(\u00260) {\n    ///     Some(x) =\u003e *x = 100,\n    ///     None =\u003e (),\n    /// }\n    /// assert_eq!(skipmap.get(\u00260), Some(\u0026100));\n    /// ```\n    #[inline]\n    pub fn get_mut\u003cQ\u003e(\u0026mut self, key: \u0026Q) -\u003e Option\u003c\u0026mut V\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord + ?Sized,\n    {\n        self.find_key_mut(key).and_then(|node| node.value_mut())\n    }\n\n    /// Removes the first element and returns it, or `None` if the sequence is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.insert(1, \"Hello\");\n    /// skipmap.insert(2, \"World\");\n    ///\n    /// assert_eq!(skipmap.pop_front(), Some((1, \"Hello\")));\n    /// assert_eq!(skipmap.pop_front(), Some((2, \"World\")));\n    /// assert!(skipmap.pop_front().is_none());\n    /// ```\n    #[inline]\n    pub fn pop_front(\u0026mut self) -\u003e Option\u003c(K, V)\u003e {\n        if self.is_empty() {\n            None\n        } else {\n            Some(self.remove_index(0))\n        }\n    }\n\n    /// Removes the last element and returns it, or `None` if the sequence is\n    /// empty.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.insert(1, \"Hello\");\n    /// skipmap.insert(2, \"World\");\n    ///\n    /// assert_eq!(skipmap.pop_back(), Some((2, \"World\")));\n    /// assert_eq!(skipmap.pop_back(), Some((1, \"Hello\")));\n    /// assert!(skipmap.pop_back().is_none());\n    /// ```\n    #[inline]\n    pub fn pop_back(\u0026mut self) -\u003e Option\u003c(K, V)\u003e {\n        let len = self.len();\n        if len \u003e 0 {\n            Some(self.remove_index(len - 1))\n        } else {\n            None\n        }\n    }\n\n    /// Returns true if the value is contained in the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// assert!(skipmap.contains_key(\u00264));\n    /// assert!(!skipmap.contains_key(\u002615));\n    /// ```\n    pub fn contains_key\u003cQ\u003e(\u0026self, key: \u0026Q) -\u003e bool\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord + ?Sized,\n    {\n        self.find_key(key).is_some()\n    }\n\n    /// Removes and returns an element with the same value or None if there are\n    /// no such values in the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// assert_eq!(skipmap.remove(\u00264), Some(4)); // Removes the last one\n    /// assert!(skipmap.remove(\u00264).is_none());    // No more '4' left\n    /// ```\n    pub fn remove\u003cQ\u003e(\u0026mut self, key: \u0026Q) -\u003e Option\u003cV\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord + ?Sized,\n    {\n        let remover = Remover(key);\n        match remover.act(self.head.as_mut()) {\n            Ok(node) =\u003e {\n                self.len -= 1;\n                node.into_inner().map(|(_key, val)| val)\n            }\n            Err(_) =\u003e None,\n        }\n    }\n\n    /// Removes and returns an element with the given index.\n    ///\n    /// # Panics\n    ///\n    /// Panics is the index is out of bounds.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// assert_eq!(skipmap.remove_index(4), (4, 4));\n    /// assert_eq!(skipmap.remove_index(4), (5, 5));\n    /// ```\n    pub fn remove_index(\u0026mut self, index: usize) -\u003e (K, V) {\n        if index \u003e= self.len() {\n            panic!(\"Index out of bounds.\");\n        } else {\n            let node = self.head.remove_at(index).unwrap();\n            self.len -= 1;\n            node.into_inner().unwrap()\n        }\n    }\n\n    /// Get an owning iterator over the entries of the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// for (k, v) in skipmap.into_iter() {\n    ///     println!(\"Key {}, Value: {}\", k, v);\n    /// }\n    /// ```\n    #[allow(clippy::should_implement_trait)]\n    pub fn into_iter(mut self) -\u003e IntoIter\u003c(K, V)\u003e {\n        let len = self.len();\n        unsafe { IntoIter::from_head(\u0026mut self.head, len) }\n    }\n\n    /// Creates an iterator over the entries of the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// for (k, v) in skipmap.iter() {\n    ///     println!(\"Key: {}, Value: {}\", k, v);\n    /// }\n    /// ```\n    pub fn iter(\u0026self) -\u003e Iter\u003cK, V\u003e {\n        let len = self.len();\n        unsafe { Iter::from_head(\u0026self.head, len) }\n    }\n\n    /// Creates an mutable iterator over the entries of the skipmap.\n    ///\n    /// The keys cannot be modified as they must remain in order.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// for (k, v) in skipmap.iter_mut() {\n    ///     println!(\"Key: {}, Value: {}\", k, v);\n    /// }\n    /// ```\n    pub fn iter_mut(\u0026mut self) -\u003e IterMut\u003cK, V\u003e {\n        let len = self.len();\n        unsafe { IterMut::from_head(\u0026mut self.head, len) }\n    }\n\n    /// Creates an iterator over the keys of the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// for k in skipmap.keys() {\n    ///     println!(\"Key: {}\", k);\n    /// }\n    /// ```\n    pub fn keys(\u0026self) -\u003e Keys\u003cK, V\u003e {\n        Keys(self.iter())\n    }\n\n    /// Creates an iterator over the values of the skipmap.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// for v in skipmap.values() {\n    ///     println!(\"Value: {}\", v);\n    /// }\n    /// ```\n    pub fn values(\u0026self) -\u003e Values\u003cK, V\u003e {\n        Values(self.iter())\n    }\n\n    /// Constructs a double-ended iterator over a sub-range of elements in the\n    /// skipmap, starting at min, and ending at max. If min is `Unbounded`, then\n    /// it will be treated as \"negative infinity\", and if max is `Unbounded`,\n    /// then it will be treated as \"positive infinity\".  Thus range(Unbounded,\n    /// Unbounded) will yield the whole collection.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    /// use std::ops::Bound::{Included, Unbounded};\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    /// for (k, v) in skipmap.range(Included(\u00263), Included(\u00267)) {\n    ///     println!(\"Key: {}, Value: {}\", k, v);\n    /// }\n    /// assert_eq!(Some((\u00264, \u00264)), skipmap.range(Included(\u00264), Unbounded).next());\n    /// ```\n    pub fn range\u003cQ\u003e(\u0026self, min: Bound\u003c\u0026Q\u003e, max: Bound\u003c\u0026Q\u003e) -\u003e Iter\u003cK, V\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord,\n    {\n        let iter_inner = self._range(min, max).unwrap_or(skipnode::Iter {\n            first: None,\n            last: None,\n            size: 0,\n        });\n        Iter(iter_inner)\n    }\n\n    fn _range\u003cQ\u003e(\u0026self, min: Bound\u003c\u0026Q\u003e, max: Bound\u003c\u0026Q\u003e) -\u003e Option\u003cskipnode::Iter\u003c(K, V)\u003e\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord,\n    {\n        let (first, first_distance_from_head) = self._lower_bound(min)?;\n        let (last, last_distance_from_head) = self._upper_bound(max);\n        let size = last_distance_from_head.checked_sub(first_distance_from_head)? + 1;\n        Some(skipnode::Iter {\n            first: Some(first),\n            last: Some(last),\n            size,\n        })\n    }\n\n    /// Returns an `Option\u003c\u0026V\u003e` pointing to the lowest element whose key is above\n    /// the given bound. If no such element is found then `None` is\n    /// returned.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    /// use std::ops::Bound::{Included, Excluded, Unbounded};\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    ///\n    /// assert_eq!(skipmap.lower_bound(Unbounded), Some((\u00260, \u00260)));\n    /// assert_eq!(skipmap.lower_bound(Excluded(\u00260)), Some((\u00261, \u00261)));\n    /// assert_eq!(skipmap.lower_bound(Included(\u00260)), Some((\u00260, \u00260)));\n    /// assert_eq!(skipmap.lower_bound(Included(\u002610)), None);\n    /// ```\n    pub fn lower_bound\u003cQ\u003e(\u0026self, min: Bound\u003c\u0026Q\u003e) -\u003e Option\u003c(\u0026K, \u0026V)\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord,\n    {\n        self._lower_bound(min).and_then(|(node, _)| node.item_ref())\n    }\n\n    /// Returns an `Option\u003c\u0026V\u003e` pointing to the highest element whose key is above\n    /// the given bound. If no such element is found then `None` is\n    /// returned.\n    ///\n    /// # Examples\n    ///\n    /// ```\n    /// use skiplist::SkipMap;\n    /// use std::ops::Bound::{Included, Excluded, Unbounded};\n    ///\n    /// let mut skipmap = SkipMap::new();\n    /// skipmap.extend((0..10).map(|x| (x, x)));\n    ///\n    /// assert_eq!(skipmap.upper_bound(Unbounded), Some((\u00269, \u00269)));\n    /// assert_eq!(skipmap.upper_bound(Excluded(\u00269)), Some((\u00268, \u00268)));\n    /// assert_eq!(skipmap.upper_bound(Included(\u00269)), Some((\u00269, \u00269)));\n    /// assert_eq!(skipmap.upper_bound(Excluded(\u00260)), None);\n    /// ```\n    pub fn upper_bound\u003cQ\u003e(\u0026self, max: Bound\u003c\u0026Q\u003e) -\u003e Option\u003c(\u0026K, \u0026V)\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord,\n    {\n        self._upper_bound(max).0.item_ref()\n    }\n\n    fn _lower_bound\u003cQ\u003e(\u0026self, min: Bound\u003c\u0026Q\u003e) -\u003e Option\u003c(\u0026SkipNode\u003cK, V\u003e, usize)\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord,\n    {\n        Some(match min {\n            Bound::Unbounded =\u003e (self.head.next_ref()?, 1usize),\n            Bound::Included(min) =\u003e {\n                let (last_lt, last_lt_from_head) = self.head.find_last_lt_with(cmp, min);\n                let first_ge = last_lt.next_ref()?;\n                (first_ge, last_lt_from_head + 1)\n            }\n            Bound::Excluded(min) =\u003e {\n                let (last_le, last_le_from_head) = self.head.find_last_le_with(cmp, min);\n                let first_gt = last_le.next_ref()?;\n                (first_gt, last_le_from_head + 1)\n            }\n        })\n    }\n\n    fn _upper_bound\u003cQ\u003e(\u0026self, max: Bound\u003c\u0026Q\u003e) -\u003e (\u0026SkipNode\u003cK, V\u003e, usize)\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord,\n    {\n        match max {\n            Bound::Unbounded =\u003e (self.head.last(), self.len()),\n            Bound::Included(max) =\u003e self.head.find_last_le_with(cmp, max),\n            Bound::Excluded(max) =\u003e self.head.find_last_lt_with(cmp, max),\n        }\n    }\n}\n\nfn cmp\u003cQ: Ord, K: Borrow\u003cQ\u003e, V\u003e(node_item: \u0026(K, V), target: \u0026Q) -\u003e Ordering {\n    node_item.0.borrow().cmp(target)\n}\n\n// ///////////////////////////////////////////////\n// Internal methods\n// ///////////////////////////////////////////////\n\nimpl\u003cK: Ord, V\u003e SkipMap\u003cK, V\u003e {\n    /// Checks the integrity of the skipmap.\n    #[allow(dead_code)]\n    fn check(\u0026self) {\n        self.head.check();\n        if let Some(mut node) = self.head.next_ref() {\n            let mut key = node.key_ref().unwrap();\n            while let Some(next_node) = node.next_ref() {\n                let next_key = next_node.key_ref().unwrap();\n                assert!(key \u003c= next_key);\n                node = next_node;\n                key = next_key;\n            }\n        }\n    }\n}\n\nimpl\u003cK, V\u003e SkipMap\u003cK, V\u003e {\n    /// Find the reference to the node equal to the given key.\n    fn find_key\u003cQ\u003e(\u0026self, key: \u0026Q) -\u003e Option\u003c\u0026SkipNode\u003cK, V\u003e\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord + ?Sized,\n    {\n        let (last_le, _) = self.head.find_last_le_with(\n            |(node_key, _), target| Ord::cmp(node_key.borrow(), target),\n            key,\n        );\n        let node_key = last_le.key_ref()?;\n        if node_key.borrow() == key {\n            Some(last_le)\n        } else {\n            None\n        }\n    }\n\n    /// Find the mutable reference to the node equal to the given key.\n    fn find_key_mut\u003cQ\u003e(\u0026mut self, key: \u0026Q) -\u003e Option\u003c\u0026mut SkipNode\u003cK, V\u003e\u003e\n    where\n        K: Borrow\u003cQ\u003e,\n        Q: Ord + ?Sized,\n    {\n        let (last_le, _) = self.head.find_last_le_with_mut(\n            |(node_key, _), target| Ord::cmp(node_key.borrow(), target),\n            key,\n        );\n        let node_key = last_le.key_ref()?;\n        if node_key.borrow() == key {\n            Some(last_le)\n        } else {\n            None\n        }\n    }\n\n    /// Gets a reference to the node with the given index.\n    fn get_index(\u0026self, index: usize) -\u003e Option\u003c\u0026SkipNode\u003cK, V\u003e\u003e {\n        self.head.advance(index + 1)\n    }\n\n    /// Gets a mutable reference to the node with the given index.\n    fn get_index_mut(\u0026mut self, index: usize) -\u003e Option\u003c\u0026mut SkipNode\u003cK, V\u003e\u003e {\n        self.head.advance_mut(index + 1)\n    }\n}\n\nimpl\u003cK, V\u003e SkipMap\u003cK, V\u003e\nwhere\n    K: fmt::Debug,\n    V: fmt::Debug,\n{\n    /// Prints out the internal structure of the skipmap (for debugging\n    /// purposes).\n    #[allow(dead_code)]\n    fn debug_structure(\u0026self) {\n        unsafe {\n            let mut node: *const SkipNode\u003cK, V\u003e = mem::transmute_copy(\u0026self.head);\n            let mut rows: Vec\u003c_\u003e = iter::repeat(String::new())\n                .take(self.level_generator.total())\n                .collect();\n\n            loop {\n                let value = match ((*node).key_ref(), (*node).value_ref()) {\n                    (Some(k), Some(v)) =\u003e {\n                        format!(\"\u003e ({:?}, {:?})\", k, v)\n                    }\n                    _ =\u003e \"\u003e ()\".to_string(),\n                };\n\n                let max_str_len = format!(\"{} -{}-\", value, (*node).links_len[(*node).level]).len();\n\n                let mut lvl = self.level_generator.total();\n                while lvl \u003e 0 {\n                    lvl -= 1;\n\n                    let mut value_len = if lvl \u003c= (*node).level {\n                        format!(\"{} -{}-\", value, (*node).links_len[lvl])\n                    } else {\n                        format!(\"{} -\", value)\n                    };\n                    for _ in 0..(max_str_len - value_len.len()) {\n                        value_len.push('-');\n                    }\n\n                    let mut dashes = String::new();\n                    for _ in 0..value_len.len() {\n                        dashes.push('-');\n                    }\n\n                    if lvl \u003c= (*node).level {\n                        rows[lvl].push_str(value_len.as_ref());\n                    } else {\n                        rows[lvl].push_str(dashes.as_ref());\n                    }\n                }\n\n                match (*node).links[0].and_then(|p| p.as_ptr().as_ref()) {\n                    Some(next) =\u003e {\n                        node = next;\n                    }\n                    _ =\u003e {\n                        break;\n                    }\n                }\n            }\n\n            for row in rows.iter().rev() {\n                println!(\"{}\", row);\n            }\n        }\n    }\n}\n\n// ///////////////////////////////////////////////\n// List Actions\n// ///////////////////////////////////////////////\n\nstruct InsertOrReplace\u003cK, V, MakeNode\u003e\nwhere\n    K: Ord,\n    MakeNode: FnOnce(K, V) -\u003e Box\u003cSkipNode\u003cK, V\u003e\u003e,\n{\n    key: K,\n    value: V,\n    make_node: MakeNode,\n}\n\nimpl\u003cK, V, MakeNode\u003e InsertOrReplace\u003cK, V, MakeNode\u003e\nwhere\n    K: Ord,\n    MakeNode: FnOnce(K, V) -\u003e Box\u003cSkipNode\u003cK, V\u003e\u003e,\n{\n    fn new(key: K, value: V, make_node: MakeNode) -\u003e Self {\n        Self {\n
