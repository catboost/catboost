[package]
edition = "2018"
rust-version = "1.83"
name = "async-compression"
version = "0.4.51"
authors = [
    "Wim Looman <wim@nemo157.com>",
    "Allen Bui <fairingrey@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Adaptors between compression crates and Rust's modern asynchronous IO types.
"""
readme = "README.md"
keywords = [
    "compression",
    "decompression",
    "async-io",
    "tokio",
    "futures-io",
]
categories = [
    "compression",
    "asynchronous",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nullus157/async-compression"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustc-args = [
    "--cfg",
    "async_compression_unstable",
]
rustdoc-args = [
    "--cfg",
    "async_compression_unstable",
]

[features]
all = [
    "all-implementations",
    "all-algorithms",
]
all-algorithms = [
    "brotli",
    "bzip2",
    "deflate",
    "deflate64",
    "gzip",
    "lz4",
    "lzma",
    "xz",
